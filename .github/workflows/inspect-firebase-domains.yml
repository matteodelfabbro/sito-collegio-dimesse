name: Controlla domini Firebase

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Autentica Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/377076163895/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-firebase-hosting@sito-scuola-1e42f.iam.gserviceaccount.com
          project_id: sito-scuola-1e42f

      - name: Leggi configurazione domini
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            'https://firebasehosting.googleapis.com/v1beta1/projects/sito-scuola-1e42f/sites/sito-scuola-1e42f/customDomains' \
            | jq '{customDomains: [.customDomains[]? | {name, redirectTarget, hostState, ownershipState, etag}]}'
